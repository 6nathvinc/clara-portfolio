<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Clara Beltzung — Portfolio en cours de construction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{fontFamily:{display:['Fraunces','Georgia','serif'],body:['DM Sans','sans-serif'],mono:['DM Mono','monospace']}}}}</script>
  <style>
    body{background-color:#F7F6F2;font-family:'DM Sans',sans-serif;color:#181818}
    @keyframes pulse-slow{0%,100%{opacity:1}50%{opacity:.4}}
    .pulse{animation:pulse-slow 2.5s ease-in-out infinite}
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-24">
    <div class="flex items-center gap-2 mb-16">
      <span class="w-2 h-2 rounded-full bg-[#1E3A5F] pulse inline-block"></span>
      <span class="font-mono text-xs tracking-widest text-[#6B6B6B]" style="font-family:'DM Mono',monospace">EN COURS DE CONSTRUCTION</span>
    </div>
    <h1 class="font-display text-6xl md:text-8xl font-black text-[#181818] text-center leading-none mb-4">
      Clara<br/>Beltzung
    </h1>
    <p class="font-mono text-xs tracking-widest text-[#6B6B6B] text-center mb-12" style="font-family:'DM Mono',monospace">
      PORTFOLIO · BUT MESURES PHYSIQUES · IUT NORD FRANCHE-COMTÉ
    </p>
    <div class="max-w-sm text-center mb-16">
      <p class="text-[#6B6B6B] text-base leading-relaxed">Ce portfolio est en cours de réalisation et sera disponible très prochainement.</p>
    </div>
    <div class="w-16 border-t border-[#DDD8CE] mb-16"></div>
    <!-- Lien discret vers le vrai accueil — visible seulement si on le cherche -->
    <a href="accueil.html" class="font-mono text-xs tracking-widest text-[#DDD8CE] hover:text-[#6B6B6B] transition-colors duration-300" style="font-family:'DM Mono',monospace">aperçu →</a>
  </main>
  <footer class="border-t border-[#DDD8CE] py-6 px-6">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
      <p class="font-mono text-xs text-[#DDD8CE]" style="font-family:'DM Mono',monospace">© 2025 Clara Beltzung · Université Marie et Louis Pasteur</p>
      <p class="font-mono text-xs text-[#DDD8CE]" style="font-family:'DM Mono',monospace">Hébergé par <a href="https://nathouworks.fr" class="hover:text-[#6B6B6B] transition-colors">NathouWorks</a></p>
    </div>
  </footer>
</body>
</html>
